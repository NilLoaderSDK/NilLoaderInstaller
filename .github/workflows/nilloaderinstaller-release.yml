name: NilLoaderInstaller Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew clean build

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(grep -m1 "version =" build.gradle | sed -E "s/.*version *= *['\"]([^'\"]+)['\"].*/\1/")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGE.md
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          python - <<'PY' "$VERSION"
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog_path = Path("CHANGE.md")
          text = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""

          patterns = [
              rf"^##\s*\[?v?{re.escape(version)}\]?\s*$",
              rf"^##\s*\[?{re.escape(version)}\]?\s*$",
          ]

          lines = text.splitlines()
          body = []
          found = False

          for index, line in enumerate(lines):
              if any(re.match(pattern, line.strip()) for pattern in patterns):
                  found = True
                  for next_line in lines[index + 1:]:
                      if re.match(r"^##\s+", next_line):
                          break
                      body.append(next_line)
                  break

          if not found:
              body = ["- No release notes found for this version in CHANGE.md."]

          release_body = "\n".join(body).strip() or "- No release notes found for this version in CHANGE.md."
          Path("release-notes.md").write_text(release_body, encoding="utf-8")
          print(release_body)
          PY

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: NilLoaderInstaller-${{ steps.release_tag.outputs.version }}
          path: build/libs/NilLoaderInstaller-*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: NilLoaderInstaller ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: build/libs/NilLoaderInstaller-*.jar
          draft: false
          prerelease: false
